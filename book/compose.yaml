services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: bookdb
      POSTGRES_USER: book
      POSTGRES_PASSWORD: book
    ports:
      - "5433:5432"
    volumes:
      - book-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book -d bookdb"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookdb
      SPRING_DATASOURCE_USERNAME: book
      SPRING_DATASOURCE_PASSWORD: book
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  book-pgdata: