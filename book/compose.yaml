services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: bookdb
      POSTGRES_USER: book
      POSTGRES_PASSWORD: book
    ports:
      - "5433:5432"
    volumes:
      - book-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book -d bookdb"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookdb
      SPRING_DATASOURCE_USERNAME: book
      SPRING_DATASOURCE_PASSWORD: book
      # Local-only values. In production set real ones in the host's environment settings.
      JWT_SECRET: local-dev-secret-change-me-in-production-0123456789
      ADMIN_EMAIL: admin@shelfmallow.dev
      ADMIN_PASSWORD: admin12345
      APP_CORS_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  book-pgdata: