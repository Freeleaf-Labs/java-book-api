spring:
  application:
    name: book
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/bookdb}
    username: ${SPRING_DATASOURCE_USERNAME:book}
    password: ${SPRING_DATASOURCE_PASSWORD:book}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    # Entities are turned into DTOs inside the service, so no session is kept open for the view.
    open-in-view: false
server:
  port: ${PORT:8080}
  # Behind a proxy (Render, nginx) this makes the app see the real https:// URL,
  # which Swagger UI and the Secure flag of the refresh cookie both depend on.
  forward-headers-strategy: framework

app:
  jwt:
    # 32+ characters. Left empty, a random key is generated on every start (see SecurityConfig).
    secret: ${JWT_SECRET:}
  cors:
    # Comma-separated list of frontend origins allowed to call the API from a browser.
    origins: ${APP_CORS_ORIGINS:http://localhost:5173 , https://book.milapmagar.com.np}
  cookie:
    # Lax works when the frontend is on the same site (e.g. another subdomain).
    # Use None when the frontend lives on a different domain entirely.
    same-site: ${APP_COOKIE_SAME_SITE:Lax}
  admin:
    # The first admin is created from these at startup when no admin exists yet.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  # Fills an empty database with a few categories and books.
  seed-demo-data: ${APP_SEED_DEMO_DATA:true}

springdoc:
  swagger-ui:
    # Keeps the pasted token after a page reload.
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: alpha
